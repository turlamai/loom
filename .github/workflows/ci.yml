name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.14
        with:
          version: '8.18'
      - run: raco pkg install --auto --name loom-dev --link "$(pwd)"
      - run: raco test loom/main.rkt loom/html.rkt loom/http.rkt loom/forms.rkt loom/security.rkt loom/cookies.rkt loom/session.rkt loom/csrf.rkt loom/session-http.rkt loom/csrf-middleware.rkt loom/db.rkt loom/migrate.rkt loom/model.rkt loom/repository.rkt loom/live.rkt
      - run: raco make examples/hello.rkt
      - run: raco loom doctor
      - run: raco loom new /tmp/loom-smoke
      - run: cd /tmp/loom-smoke && raco loom inspect --json && raco loom test
      - run: bash examples/taskboard/smoke.sh
